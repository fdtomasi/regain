# Build, lint, and test regain across the supported Python matrix.

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          sudo apt-get install liblapacke-dev -y
          python -m pip install --upgrade pip
          # `dev` extras pull in pytest + pytest-cov + ruff; `plot` and
          # `fused-lasso` are optional and only used by a couple of tests
          # (which skip gracefully if the import fails).
          pip install -e ".[dev,plot]"
          pip install ".[fused-lasso]" || echo "fused-lasso extras (prox-tv) failed to install; tests using them will be skipped"
      - name: Lint with ruff
        run: |
          ruff check regain/
      - name: Test with pytest
        run: |
          pytest --cov=regain --cov-report=term --cov-report=html --cov-report=xml
      - name: Coverage summary
        if: always() && hashFiles('.coverage') != ''
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo ""
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14
