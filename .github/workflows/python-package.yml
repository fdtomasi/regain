# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get install liblapacke-dev -y
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest pytest-cov
          pip install -r requirements.txt
          pip install -r requirements-optional.txt || echo "optional deps failed to install; tests using them will be skipped"
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          pytest --cov=regain --cov-report=term --cov-report=html --cov-report=xml
      - name: Coverage summary
        if: always() && hashFiles('.coverage') != ''
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo ""
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14
